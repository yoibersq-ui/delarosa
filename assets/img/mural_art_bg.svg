<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="none" fill="none">
  <defs>
    <!-- Gradiente de fondo obsidian ultra profundo -->
    <radialGradient id="bgGrad" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#14141e"/>
      <stop offset="50%" stop-color="#09090d"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>

    <!-- Gradiente cromo plata líquido -->
    <linearGradient id="chromeSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f1f5f9" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#cbd5e1" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Gradiente grafito oscuro brillante -->
    <linearGradient id="slateRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Fondo Obsidian -->
  <rect width="1600" height="1200" fill="url(#bgGrad)"/>

  <!-- ================= ONDAS FLUIDAS LADO IZQUIERDO ================= -->
  <!-- Masa suave izquierda -->
  <path d="M-60,0 C160,200 40,480 150,720 C240,940 90,1100 180,1200 L-60,1200 Z" fill="url(#slateRibbon)"/>
  
  <!-- Líneas continuas en plata metálica y cromo brillante -->
  <path d="M-30,0 C190,210 60,490 170,730 C260,950 110,1110 200,1200" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85" stroke-linecap="round"/>
  <path d="M10,0 C230,240 100,520 210,760 C300,980 150,1130 240,1200" stroke="#e2e8f0" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round"/>
  <path d="M50,0 C270,270 140,550 250,790 C340,1010 190,1150 280,1200" stroke="#cbd5e1" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M90,0 C310,300 180,580 290,820 C380,1040 230,1170 320,1200" stroke="#94a3b8" stroke-width="1.8" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M130,0 C350,330 220,610 330,850 C420,1070 270,1190 360,1200" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M170,0 C390,360 260,640 370,880 C460,1100 310,1200 400,1200" stroke="#475569" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="8 5" stroke-linecap="round"/>

  <!-- ================= ONDAS FLUIDAS LADO DERECHO ================= -->
  <!-- Masa suave derecha -->
  <path d="M1660,0 C1440,200 1560,480 1450,720 C1360,940 1510,1100 1420,1200 L1660,1200 Z" fill="url(#slateRibbon)"/>
  
  <path d="M1630,0 C1410,210 1540,490 1430,730 C1340,950 1490,1110 1400,1200" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85" stroke-linecap="round"/>
  <path d="M1590,0 C1370,240 1500,520 1390,760 C1300,980 1450,1130 1360,1200" stroke="#e2e8f0" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round"/>
  <path d="M1550,0 C1330,270 1460,550 1350,790 C1260,1010 1410,1150 1320,1200" stroke="#cbd5e1" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M1510,0 C1290,300 1420,580 1310,820 C1220,1040 1370,1170 1280,1200" stroke="#94a3b8" stroke-width="1.8" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M1470,0 C1250,330 1380,610 1270,850 C1180,1070 1330,1190 1240,1200" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M1430,0 C1210,360 1340,640 1230,880 C1140,1100 1290,1200 1200,1200" stroke="#475569" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="8 5" stroke-linecap="round"/>

  <!-- ================= ELEMENTOS ORGÁNICOS CENTRALES DISCRETOS ================= -->
  <path d="M120,480 C180,430 260,460 280,530 C300,600 230,670 160,680 C90,690 40,630 60,560 C75,495 105,485 120,480 Z" stroke="#e2e8f0" stroke-width="2" stroke-opacity="0.45" fill="none"/>
  <path d="M1480,440 C1540,390 1620,420 1640,490 C1660,560 1590,630 1520,640 C1450,650 1400,590 1420,520 C1435,455 1465,445 1480,440 Z" stroke="#e2e8f0" stroke-width="2" stroke-opacity="0.45" fill="none"/>
</svg>
